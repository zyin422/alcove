name: Accountabilibrosis

options:
  bundleIdPrefix: com.accountabilibrosis
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Accountabilibrosis:
    type: application
    platform: macOS
    sources:
      - path: Accountabilibrosis
    postCompileScripts:
      # Bundles the repo-root .env (team Discord bot token) as Resources/discord.env, read by EnvFile.
      # A missing .env is fine: the app then needs a token from Settings. The script never prints the file.
      - name: Bundle team .env
        script: |
          ENV_SRC="${SRCROOT}/../.env"
          ENV_DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/discord.env"
          if [ -f "$ENV_SRC" ]; then
            mkdir -p "$(dirname "$ENV_DEST")"
            cp "$ENV_SRC" "$ENV_DEST"
          else
            rm -f "$ENV_DEST"
          fi
          exit 0
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: Accountabilibrosis
        PRODUCT_BUNDLE_IDENTIFIER: com.accountabilibrosis.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Accountabilibrosis
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Accountabilibrosis opens and arranges your study sites in Google Chrome and closes off-topic tabs while you're locked in."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  AccountabilibrosisTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AccountabilibrosisTests
    dependencies:
      - target: Accountabilibrosis
    settings:
      base:
        PRODUCT_NAME: AccountabilibrosisTests
        PRODUCT_BUNDLE_IDENTIFIER: com.accountabilibrosis.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Accountabilibrosis.app/Contents/MacOS/Accountabilibrosis"
        BUNDLE_LOADER: "$(TEST_HOST)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"

schemes:
  Accountabilibrosis:
    build:
      targets:
        Accountabilibrosis: all
        AccountabilibrosisTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: AccountabilibrosisTests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
