name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Tofu
    steps:
      - uses: actions/checkout@v4

      # The project needs Xcode 16.3 or later (README).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      # The generated .xcodeproj is committed; fail when project.yml and it disagree.
      - name: Check the Xcode project is up to date
        run: |
          xcodegen generate
          git diff --exit-code -- Tofu.xcodeproj

      # The local "Accountabilibrosis Local Codesign" certificate does not exist on CI, so sign ad hoc.
      - name: Build and run tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test -quiet \
            -project Tofu.xcodeproj \
            -scheme Tofu \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            2>&1 | tee build/xcodebuild.log

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            Tofu/build/TestResults.xcresult
            Tofu/build/xcodebuild.log
          retention-days: 7
