name: Tofu

options:
  bundleIdPrefix: com.tofu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # A stable local certificate, so the Accessibility grant survives rebuilds. Ad-hoc signing
    # ("-") changes every build and macOS asks for Accessibility again even after it was allowed.
    CODE_SIGN_IDENTITY: "Accountabilibrosis Local Codesign"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    DEVELOPMENT_TEAM: ""
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: 0.18.3

targets:
  Tofu:
    type: application
    platform: macOS
    sources:
      - path: Tofu
    dependencies:
      - package: Sparkle
      - package: FluidAudio
        product: FluidAudio
    # Sparkle reads these from Info.plist; Xcode merges this file with the generated Info.plist keys below.
    info:
      path: Tofu/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: https://raw.githubusercontent.com/axion66/tofu-releases/main/appcast.xml
        SUPublicEDKey: my3cG5Hh9Yhc83xOkrv32Wq8IzQhgBZFE6Y7JXs7qow=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAllowsAutomaticUpdates: false
    postCompileScripts:
      # Bundles the repo-root .env (team Discord bot token, committed) followed by .env.local (personal keys such
      # as OPENAI_API_KEY, gitignored) as Resources/discord.env, read by EnvFile; later keys win. Missing files are
      # fine: the app then needs keys from Settings. The script never prints the files.
      # Release builds (TOFU_RELEASE=1, set by scripts/release.sh) are published publicly, so they bundle nothing.
      - name: Bundle team .env
        script: |
          ENV_DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/discord.env"
          rm -f "$ENV_DEST"
          if [ "${TOFU_RELEASE:-}" = "1" ]; then
            exit 0
          fi
          for ENV_SRC in "${SRCROOT}/../.env" "${SRCROOT}/../.env.local"; do
            if [ -f "$ENV_SRC" ]; then
              mkdir -p "$(dirname "$ENV_DEST")"
              cat "$ENV_SRC" >> "$ENV_DEST"
              printf '\n' >> "$ENV_DEST"
            fi
          done
          exit 0
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: Tofu
        PRODUCT_BUNDLE_IDENTIFIER: com.tofu.app
        # Sparkle only runs in builds made by scripts/release.sh (TOFU_RELEASE=1), so builds from source never replace themselves.
        TOFU_RELEASE_CONDITION_1: TOFU_RELEASE
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(TOFU_RELEASE_CONDITION_$(TOFU_RELEASE))"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tofu
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Tofu opens and arranges your study sites in Google Chrome and closes off-topic tabs while you're locked in."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Tofu listens when you press the mic so you can talk to your study buddy."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Your speech is turned into text on this Mac so you can talk to your study buddy."
        INFOPLIST_KEY_NSFocusStatusUsageDescription: "Tofu checks whether a Focus is already on so a work block does not turn off Do Not Disturb you set yourself."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  TofuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TofuTests
    dependencies:
      - target: Tofu
    settings:
      base:
        PRODUCT_NAME: TofuTests
        PRODUCT_BUNDLE_IDENTIFIER: com.tofu.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tofu.app/Contents/MacOS/Tofu"
        BUNDLE_LOADER: "$(TEST_HOST)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"

schemes:
  Tofu:
    build:
      targets:
        Tofu: all
        TofuTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: TofuTests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
